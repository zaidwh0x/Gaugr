name: Build Gaugr for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish Gaugr/Gaugr.App/Gaugr.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ./publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Rename application executable
        run: Rename-Item ./publish/Gaugr.App.exe Gaugr.exe

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $Matches[1] } else { '0.1.0' }
          $compiler = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\lib\innosetup\tools\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $compiler) {
            throw "Could not locate ISCC.exe. Inno Setup may be installed in a different location."
          }
          & $compiler "/DMyAppVersion=$version" "installer/Gaugr.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Gaugr-portable-windows-x64
          path: ./publish/Gaugr.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Gaugr-installer-windows-x64
          path: ./publish/Gaugr-Setup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Gaugr ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ./publish/Gaugr.exe
            ./publish/Gaugr-Setup.exe
