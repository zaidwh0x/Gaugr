name: Build Gaugr for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish Gaugr/Gaugr.App/Gaugr.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ./publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gaugr-windows-x64
          path: ./publish/Gaugr.App.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Gaugr ${{ github.ref_name }}
          generate_release_notes: true
          files: ./publish/Gaugr.App.exe
